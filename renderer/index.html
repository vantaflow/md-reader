<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<!-- Markdown can carry raw HTML, and a .md opened by double-click is untrusted
     input. No 'unsafe-inline' in script-src means neither a <script> tag nor an
     onerror= attribute smuggled into a document can run. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'" />
<title>MD Reader</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
<link rel="stylesheet" id="hljs-theme" href="../node_modules/highlight.js/styles/github.min.css" />
</head>
<body>
  <header>
    <button id="btn-sidebar" title="Afficher/masquer le panneau latéral">☰</button>
    <button id="btn-open" title="Ouvrir (Cmd+O)">📄 Ouvrir</button>
    <button id="btn-open-folder" title="Ouvrir dossier (Cmd+Shift+O)">📁 Dossier</button>
    <button id="btn-save" title="Enregistrer (Cmd+S)">💾 Enregistrer</button>
    <button id="btn-export" title="Exporter PDF (Cmd+E)">📕 PDF</button>
    <button id="btn-export-html" title="Exporter HTML">🌐 HTML</button>
    <button id="btn-default-reader" title="Définir MD Reader comme lecteur Markdown par défaut">⭐ Défaut</button>
    <span class="sep"></span>
    <label class="toggle"><input type="checkbox" id="toggle-editor" /> Code</label>
    <label class="toggle"><input type="checkbox" id="toggle-sync" checked /> Sync</label>
    <label class="toggle"><input type="checkbox" id="toggle-autosave" /> Autosave</label>
    <select id="mode-affichage" title="Affichage de l'aperçu">
      <option value="continu">Continu</option>
      <option value="a4" selected>A4 · 1 page</option>
      <option value="a4-double">A4 · 2 pages</option>
    </select>
    <button id="btn-theme" title="Thème (Cmd+T)">🌓</button>
    <span id="file-name">Sans titre</span>
  </header>

  <div id="tabs"></div>

  <main>
    <aside id="sidebar">
      <div id="sidebar-resizer" title="Glisser pour redimensionner · double-clic : largeur par défaut"></div>
      <div class="sidebar-tabs">
        <button data-tab="toc">Plan</button>
        <button data-tab="files" class="active">Fichiers</button>
        <button data-tab="search">Recherche</button>
      </div>
      <div id="tab-files" class="tab-panel active">
        <div id="folder-name" class="folder-name">Aucun dossier</div>
        <div id="favoris" class="hidden"></div>
        <div id="tags-filtre" class="hidden">
          <input type="text" id="tags-champ" placeholder="Filtrer par tag…" autocomplete="off" />
          <div id="tags-liste"></div>
        </div>
        <div id="file-tree"></div>
      </div>
      <div id="tab-toc" class="tab-panel">
        <div id="toc"></div>
        <div id="retroliens">
          <div class="section-titre">Rétroliens</div>
          <div id="retroliens-liste"></div>
        </div>
      </div>
      <div id="tab-search" class="tab-panel">
        <input type="text" id="search-input" placeholder="Rechercher dans le dossier…" />
        <div id="remplacer">
          <input type="text" id="replace-input" placeholder="Remplacer par…" autocomplete="off" />
          <div class="options-remplacer">
            <label title="Respecter la casse"><input type="checkbox" id="opt-casse" /> Aa</label>
            <label title="Mot entier"><input type="checkbox" id="opt-mot" /> Mot</label>
            <label title="Expression régulière ($1, $&amp; dans le remplacement)"><input type="checkbox" id="opt-regex" /> .*</label>
          </div>
          <button type="button" id="replace-preview-btn">Aperçu des changements</button>
        </div>
        <div id="replace-preview" class="hidden"></div>
        <div id="search-results"></div>
      </div>
    </aside>
    <div id="editor"></div>
    <div id="preview" class="markdown-body"></div>
  </main>

  <footer id="statusbar">
    <span id="stats">0 mots · 0 car · 0 min lecture</span>
    <span id="cursor-pos">Ln 1 · Col 1</span>
    <span id="dirty-indicator"></span>
  </footer>

  <!-- Messages du lot : l'en-tête (où vit #file-name) est masqué par le mode
       focus, donc un message qui n'y passerait que par là serait invisible
       (refus, progression, résumé) pendant un export lancé en mode focus.
       Ce conteneur n'est jamais masqué par body.focus. -->
  <div id="lot-notification" class="hidden"></div>

  <div id="pdf-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Options d'export PDF</h3>
      <label>Format
        <select id="pdf-page-size">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
          <option value="A3">A3</option>
          <option value="A5">A5</option>
        </select>
      </label>
      <label>Orientation
        <select id="pdf-landscape">
          <option value="false">Portrait</option>
          <option value="true">Paysage</option>
        </select>
      </label>
      <label>Marges (pouces)
        <input type="number" id="pdf-margin" value="0.5" step="0.1" min="0" max="2" />
      </label>
      <label class="row"><input type="checkbox" id="pdf-header-footer" checked /> Numéros de page</label>
      <label class="row"><input type="checkbox" id="pdf-break-h1" /> Saut de page avant chaque titre 1</label>
      <label class="row"><input type="checkbox" id="pdf-number-headings" /> Numéroter les titres</label>
      <label class="row"><input type="checkbox" id="pdf-cover" /> Page de garde (depuis le front-matter)</label>
      <label>Thème
        <select id="pdf-theme">
          <option value="sobre">Sobre</option>
          <option value="rapport">Rapport</option>
          <option value="academique">Académique</option>
        </select>
      </label>
      <label>En-tête
        <input type="text" id="pdf-header-text" placeholder="(optionnel)" />
      </label>
      <label>Filigrane
        <input type="text" id="pdf-watermark" placeholder="(optionnel)" />
      </label>
      <div class="modal-actions">
        <button id="pdf-cancel">Annuler</button>
        <button id="pdf-confirm" class="primary">Exporter</button>
      </div>
    </div>
  </div>

  <div id="palette" class="hidden">
    <div class="palette-boite">
      <input type="text" id="palette-requete" placeholder="Rechercher une commande…" autocomplete="off" />
      <ul id="palette-liste"></ul>
    </div>
  </div>

  <script src="../node_modules/mermaid/dist/mermaid.min.js"></script>
  <script src="markdown-bundle.js"></script>
  <script src="editor-bundle.js"></script>
  <script src="docx-bundle.js"></script>
  <script src="jszip-bundle.js"></script>
  <script src="import-bundle.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/raccourcis.js"></script>
  <script src="lib/format.js"></script>
  <script src="lib/tableau.js"></script>
  <script src="lib/reformat.js"></script>
  <script src="lib/emoji.js"></script>
  <script src="lib/liens.js"></script>
  <script src="lib/modeles.js"></script>
  <script src="lib/snippets.js"></script>
  <script src="lib/plan.js"></script>
  <script src="lib/wiki.js"></script>
  <script src="lib/tags.js"></script>
  <script src="lib/themes-export.js"></script>
  <script src="lib/html-riche.js"></script>
  <script src="lib/epub.js"></script>
  <script src="lib/import.js"></script>
  <script src="lib/diaporama.js"></script>
  <script src="commands.js"></script>
  <script src="features/reglages.js"></script>
  <script src="features/format.js"></script>
  <script src="features/aide.js"></script>
  <script src="features/export-docx.js"></script>
  <script src="features/modes.js"></script>
  <script src="features/images.js"></script>
  <script src="features/modale.js"></script>
  <script src="features/tableau.js"></script>
  <script src="features/reformat.js"></script>
  <script src="features/liens.js"></script>
  <script src="features/modeles.js"></script>
  <script src="features/snippets.js"></script>
  <script src="features/correcteur.js"></script>
  <script src="features/plan.js"></script>
  <script src="features/wiki.js"></script>
  <script src="features/favoris.js"></script>
  <script src="features/tags.js"></script>
  <script src="features/remplacer.js"></script>
  <script src="features/rendu.js"></script>
  <script src="features/copier-html.js"></script>
  <script src="features/export-epub.js"></script>
  <script src="features/diaporama.js"></script>
  <script src="features/import.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
